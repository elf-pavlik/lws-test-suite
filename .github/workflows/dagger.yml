name: dagger

on:
  # Run on pushes to any branch (remove when narrowing to specific branches).
  push:
  # Allow running manually from the Actions tab.
  workflow_dispatch:

jobs:
  conformance:
    name: ${{ matrix.harness }} / ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      # Each suite x implementation cell passes / fails independently; a red
      # cell must never cancel the other cells.
      fail-fast: false
      matrix:
        harness: [touchstone, lws-net]
        server: [lws-server, sparq]
        # The lws-net x sparq cell is currently red (Solid vs LWS surface).
        # Uncomment to drop that cell from the run until it conforms:
        # exclude:
        #   - harness: lws-net
        #     server: sparq
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run suite
        uses: dagger/dagger-for-github@v8.3.0
        with:
          # Aligned with the local devbox setup (dagger-engine-v0.21.9).
          version: v0.21.9
          verb: call
          # Single line on purpose: this action version writes `args` into
          # GITHUB_OUTPUT, whose format rejects embedded newlines — a multiline
          # `args: |` makes every job fail with "Invalid format ...".
          args: test --harness ${{ matrix.harness }} --server ${{ matrix.server }}
          # Optional: send traces to Dagger Cloud. Add a repository secret
          # named DAGGER_CLOUD_TOKEN and uncomment:
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}