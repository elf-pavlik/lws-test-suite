name: dagger

on:
  push:
  workflow_dispatch:

jobs:
  lws-server:
    name: lws-server (touchstone core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Touchstone core suite
        uses: dagger/dagger-for-github@v8.3.0
        with:
          # Aligned with the local devbox setup (dagger-engine-v0.21.9).
          version: v0.21.9
          verb: call
          args: |
            lws-server
          # Optional: send traces to Dagger Cloud. Add a repository secret
          # named DAGGER_CLOUD_TOKEN and uncomment:
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  sparq:
    name: sparq (touchstone core)
    runs-on: ubuntu-latest
    # Independent of lws-server: no `needs`, so a failure here neither blocks
    # nor is blocked by the other job; each reports its own check.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Touchstone core suite
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: v0.21.9
          verb: call
          args: |
            sparq
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
