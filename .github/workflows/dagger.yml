name: dagger

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: lws-server test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LWS test suite
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: v0.21.9
          verb: call
          args: |
            test
          # Optional: send traces to Dagger Cloud. Add a repository secret
          # named DAGGER_CLOUD_TOKEN and uncomment:
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
