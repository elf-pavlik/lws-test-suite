# LWS 1.0 test suite.
#
# Steps are written as higher-level LWS operations (CreateContainer,
# CreateDataResource,
# ReadResource, UpdateResource, DeleteResource -- cf.
# https://w3c.github.io/lws-protocol/lws10-core/#operations). The N3
# rules in rules.n3 map each operation to a basic HTTP request and
# default expected response described with HTTP-in-RDF
# (https://www.w3.org/TR/HTTP-in-RDF10/). `expects` states a
# test-specific response pattern (an http:Response) that overrides the
# rule-derived default.
#
# `target` is a URI template resolved by the harness at execution time:
# `param` references an execution parameter (bound from `baseUri` or by
# an extractor of an earlier step); `base` + `relative` resolves a
# relative reference against a parameter. Extractors bind parameters
# from the actual response: `path` is a JSONPath into the body, `header`
# names a response header.
#
# ValidateJsonSchemaAssertion validates the raw response body (jsonString,
# a param bound from the body text) against a JSON Schema (jsonSchema, an
# IRI under https://w3id.org/lws/test/schema/json/). The harness serves the
# local copy of each schema under its published IRI (see context.ts), so
# manifests reference the published IRI while the repo holds the source
# (schema/json/*.json).
#
# ValidateShapeAssertion validates the received content (param:content, the
# parsed RDF response body) with a ShEx shape (with, an IRI under
# https://w3id.org/lws/test/shape/). Shapes are likewise served from local
# copies (shape/*.shex) under their published IRIs.
"@context": https://w3id.org/lws/test/context
name: LWS Test Suite
rules: rules.n3
tests:
  - id: can-delete-data-resource
    type: TestCase
    name: Can delete a data resource
    comment: create a resource, read it, delete it, then reading it again fails with 404
    inputs:
      - param:storage
    constants:
      - param:storage
      - param:storage-root
      - param:new-resource
      - param:read-after-delete-status
    steps:
        - "@graph":
          operation:
            type: ReadStorageDescription
            target: param:storage
          bindings:
            - param:storage-root
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:OK
            - type: ExistanceAssertion
              received: param:storage-root
            - type: MatchJsonPathAssertion
              jsonString: param:text
              expected: param:storage-root
              jsonPath: $.service[?(@.type == 'StorageRoot')].serviceEndpoint
            - type: ValidateShapeAssertion
              received: param:content
              with: shape:storage-description
            - type: ValidateJsonSchemaAssertion
              jsonString: param:text
              jsonSchema: schema:storage-description

        - "@graph":
          operation:
            type: CreateResource
            target: param:storage-root
          bindings:
            - id: param:location
              return: param:new-resource
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:Created
            - type: ExistanceAssertion
              received: param:linkset

        - "@graph":
          operation:
          - type: ReadResource
            target: param:new-resource
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:OK

        - "@graph":
          operation:
          - type: DeleteResource
            target: param:new-resource
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:NoContent

        - "@graph":
          operation:
          - type: ReadResource
            target: param:new-resource
          bindings:
            - id: param:status-code
              return: param:read-after-delete-status
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:NotFound

    # example of an assertion on a bound const
    assertions:
      - type: IdentityAssertion
        received: param:read-after-delete-status
        expected: http-status:NotFound

  - id: can-delete-container
    type: TestCase
    name: Can delete a container
    comment: create a container, read it, delete it, then reading it again fails with 404
    inputs:
      - param:storage
    constants:
      - param:storage
      - param:storage-root
      - param:new-container
      - param:read-after-delete-status
    steps:
        - "@graph":
          operation:
            type: ReadStorageDescription
            target: param:storage
          bindings:
            - param:storage-root
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:OK
            - type: ExistanceAssertion
              received: param:storage-root
            - type: MatchJsonPathAssertion
              jsonString: param:text
              expected: param:storage-root
              jsonPath: $.service[?(@.type == 'StorageRoot')].serviceEndpoint
            - type: ValidateShapeAssertion
              received: param:content
              with: shape:storage-description
            - type: ValidateJsonSchemaAssertion
              jsonString: param:text
              jsonSchema: schema:storage-description

        - "@graph":
          operation:
            type: CreateContainer
            target: param:storage-root
          bindings:
            - id: param:location
              return: param:new-container
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:Created
            - type: ExistanceAssertion
              received: param:linkset
            - type: ExistanceAssertion
              received: param:up

        - "@graph":
          operation:
          - type: ReadContainer
            target: param:new-container
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:OK
            - type: IdentityAssertion
              received: param:content-type
              expectedLiteral: application/lws+json

        - "@graph":
          operation:
          - type: DeleteResource
            target: param:new-container
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:NoContent

        - "@graph":
          operation:
          - type: ReadContainer
            target: param:new-container
          bindings:
            - id: param:status-code
              return: param:read-after-delete-status
          assertions:
            - type: IdentityAssertion
              received: param:status-code
              expected: http-status:NotFound

    # example of an assertion on a bound const
    assertions:
      - type: IdentityAssertion
        received: param:read-after-delete-status
        expected: http-status:NotFound
