"@context":
  "@vocab": http://example.com/
  type:
    "@id": "@type"
    "@type": "@id"
  tests:
    "@container": "@list"
  steps:
    "@container": "@list"
  extractors:
    "@container": "@list"
name: LWS Test Suite
tests:
  - name: Test1
    steps:
      - request:
          method: GET
          uri:
            base:
              param: baseUri
            relative:
              value: /
        extractors:
          - param: storageRoot
            path: $.service[?@.type == 'StorageRoot'].serviceEndpoint
      - request:
          method: POST
          uri:
            param: storageRoot
        extractors:
          - param: newResource
            header: Location
      - request:
          method: GET
          uri:
            param: newResource
        extractors:
          - type: StatusCodeExtractor
            param: status1
      - request:
          method: DELETE
          uri:
            param: newResource
        extractors:
          - type: StatusCodeExtractor
            param: status2
      - request:
          method: GET
          uri:
            param: newResource
        extractors:
          - type: StatusCodeExtractor
            param: status3
    assertion:
      type: EqualityAssertion
      param: status3
      value: "404"
  - name: Test2
    steps:
      - request:
          method: GET
          uri:
            base:
              param: baseUri
            relative:
              value: /
        extractors:
          - param: storageRoot
            path: $.service[?@.type == 'StorageRoot'].serviceEndpoint
      - request:
          method: POST
          uri:
            param: storageRoot
        extractors:
          - param: newResource
            header: Location
      - request:
          method: GET
          uri:
            param: newResource
        extractors:
          - type: StatusCodeExtractor
            param: status1
      - request:
          method: DELETE
          uri:
            param: newResource
        extractors:
          - type: StatusCodeExtractor
            param: status2
    assertion:
      type: EqualityAssertion
      param: status2
      value: "204"
