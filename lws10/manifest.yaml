"@context": [./context.jsonld]
"@graph":
  - "@type": Manifest
    "@id": protocol
    name: LWS Protocol 1.0 storage discovery and REST draft
    status: Proposed
    source: https://w3c.github.io/lws-protocol/lws10-core/
    sourceRevision: 8a007c09f9b8a067a19f003de5fa47c9fee00980
    comment: >-
      Discussion draft for testing storage discovery and basic REST operations
      without prescribing authentication or authorization behavior.

    variables:
      - "@id": urn:lws-tests:variables:storageId
        "@type": Variable
        input:
          environment: LWS_STORAGE_ID
      - "@id": urn:lws-tests:variables:storageRoot
        "@type": Variable
      - "@id": urn:lws-tests:variables:rootLinkset
        "@type": Variable
      - "@id": urn:lws-tests:variables:rootEtag
        "@type": Variable
      - "@id": urn:lws-tests:variables:container
        "@type": Variable
      - "@id": urn:lws-tests:variables:containerLinkset
        "@type": Variable
      - "@id": urn:lws-tests:variables:containerEtag
        "@type": Variable
      - "@id": urn:lws-tests:variables:dataResource
        "@type": Variable
      - "@id": urn:lws-tests:variables:dataLinkset
        "@type": Variable
      - "@id": urn:lws-tests:variables:dataEtag
        "@type": Variable
      - "@id": urn:lws-tests:variables:replacedDataEtag
        "@type": Variable
      - "@id": urn:lws-tests:variables:patchedDataEtag
        "@type": Variable

    entries:
      - "@type": ValidationTest
        "@id": "#discover-storage-root"
        name: discover-storage-root
        status: Proposed
        traits: [Get, Discovery]
        source: https://w3c.github.io/lws-protocol/lws10-core/#storage-description
        prereqs: []
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:storageId
          headers:
            - fieldName: Accept
              fieldValue: application/lws+cid
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/lws+cid
          bodyShape:
            "@context":
              "@startsWith":
                - https://www.w3.org/ns/cid/v1
                - https://www.w3.org/ns/lws/v1
            id:
              "@id": urn:lws-tests:variables:storageId
            type:
              "@includes": Storage
            service:
              "@contains":
                type:
                  "@includes": StorageRoot
                serviceEndpoint:
                  "@id": urn:lws-tests:variables:storageRoot

      - "@type": ValidationTest
        "@id": "#read-storage-root"
        name: read-storage-root
        status: Proposed
        traits: [Get, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#read-resource
        prereqs:
          - "@id": "#discover-storage-root"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:storageRoot
          headers:
            - fieldName: Accept
              fieldValue: application/lws+json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/lws+json
            - fieldName: ETag
              fieldValue:
                "@id": urn:lws-tests:variables:rootEtag
          links:
            - rel: linkset
              target:
                "@id": urn:lws-tests:variables:rootLinkset
              attributes:
                type: application/linkset+json
            - rel: type
              target: https://www.w3.org/ns/lws#Container
            - rel: https://www.w3.org/ns/lws#storage
              target:
                "@id": urn:lws-tests:variables:storageId
          bodyShape:
            "@context": https://www.w3.org/ns/lws/v1
            id:
              "@id": urn:lws-tests:variables:storageRoot
            type:
              "@includes": Container
            totalItems:
              "@datatype": integer
            items:
              "@present": true

      - "@type": ValidationTest
        "@id": "#create-container"
        name: create-container
        status: Proposed
        traits: [Post, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#create-resource
        prereqs:
          - "@id": "#read-storage-root"
        request:
          method: POST
          url:
            "@id": urn:lws-tests:variables:storageRoot
          links:
            - rel: type
              target: https://www.w3.org/ns/lws#Container
          body: ""
        response:
          statusCode: 201
          headers:
            - fieldName: Location
              fieldValue:
                "@id": urn:lws-tests:variables:container
          links:
            - rel: up
              target:
                "@id": urn:lws-tests:variables:storageRoot
            - rel: linkset
              target:
                "@id": urn:lws-tests:variables:containerLinkset
              attributes:
                type: application/linkset+json

      - "@type": ValidationTest
        "@id": "#head-container"
        name: head-container
        status: Proposed
        traits: [Head, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#read-resource
        prereqs:
          - "@id": "#create-container"
        request:
          method: HEAD
          url:
            "@id": urn:lws-tests:variables:container
          headers:
            - fieldName: Accept
              fieldValue: application/lws+json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/lws+json
            - fieldName: ETag
              fieldValue:
                "@id": urn:lws-tests:variables:containerEtag
          links:
            - rel: linkset
              target:
                "@id": urn:lws-tests:variables:containerLinkset
              attributes:
                type: application/linkset+json
            - rel: up
              target:
                "@id": urn:lws-tests:variables:storageRoot
            - rel: type
              target: https://www.w3.org/ns/lws#Container
            - rel: https://www.w3.org/ns/lws#storage
              target:
                "@id": urn:lws-tests:variables:storageId
          bodyShape:
            "@absent": true

      - "@type": ValidationTest
        "@id": "#read-empty-container"
        name: read-empty-container
        status: Proposed
        traits: [Get, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#container-representation
        prereqs:
          - "@id": "#create-container"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:container
          headers:
            - fieldName: Accept
              fieldValue: application/lws+json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/lws+json
            - fieldName: ETag
              fieldValue:
                "@present": true
          links:
            - rel: linkset
              target:
                "@id": urn:lws-tests:variables:containerLinkset
              attributes:
                type: application/linkset+json
            - rel: up
              target:
                "@id": urn:lws-tests:variables:storageRoot
            - rel: type
              target: https://www.w3.org/ns/lws#Container
            - rel: https://www.w3.org/ns/lws#storage
              target:
                "@id": urn:lws-tests:variables:storageId
          bodyShape:
            "@context": https://www.w3.org/ns/lws/v1
            id:
              "@id": urn:lws-tests:variables:container
            type:
              "@includes": Container
            totalItems:
              "@datatype": integer
            items: []

      - "@type": ValidationTest
        "@id": "#create-data-resource"
        name: create-data-resource
        status: Proposed
        traits: [Post, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#create-resource
        prereqs:
          - "@id": "#head-container"
          - "@id": "#read-empty-container"
        request:
          method: POST
          url:
            "@id": urn:lws-tests:variables:container
          headers:
            - fieldName: Content-Type
              fieldValue: application/json
          body: '{"title":"draft","done":false}'
        response:
          statusCode: 201
          headers:
            - fieldName: Location
              fieldValue:
                "@id": urn:lws-tests:variables:dataResource
          links:
            - rel: up
              target:
                "@id": urn:lws-tests:variables:container
            - rel: linkset
              target:
                "@id": urn:lws-tests:variables:dataLinkset
              attributes:
                type: application/linkset+json

      - "@type": ValidationTest
        "@id": "#read-data-resource"
        name: read-data-resource
        status: Proposed
        traits: [Get, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#read-resource
        prereqs:
          - "@id": "#create-data-resource"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:dataResource
          headers:
            - fieldName: Accept
              fieldValue: application/json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/json
            - fieldName: ETag
              fieldValue:
                "@id": urn:lws-tests:variables:dataEtag
          links:
            - rel: linkset
              target:
                "@id": urn:lws-tests:variables:dataLinkset
              attributes:
                type: application/linkset+json
            - rel: up
              target:
                "@id": urn:lws-tests:variables:container
            - rel: type
              target: https://www.w3.org/ns/lws#DataResource
            - rel: https://www.w3.org/ns/lws#storage
              target:
                "@id": urn:lws-tests:variables:storageId
          bodyShape:
            title: draft
            done: false

      - "@type": ValidationTest
        "@id": "#read-data-linkset"
        name: read-data-linkset
        status: Proposed
        traits: [Get, Metadata]
        source: https://w3c.github.io/lws-protocol/lws10-core/#metadata
        prereqs:
          - "@id": "#create-data-resource"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:dataLinkset
          headers:
            - fieldName: Accept
              fieldValue: application/linkset+json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/linkset+json
            - fieldName: ETag
              fieldValue:
                "@present": true
            - fieldName: Allow
              fieldValue:
                "@containsTokens": [GET, PATCH]
            - fieldName: Accept-Patch
              fieldValue:
                "@containsToken": application/merge-patch+json
          bodyShape:
            linkset:
              "@contains":
                anchor:
                  "@id": urn:lws-tests:variables:dataResource

      - "@type": ValidationTest
        "@id": "#read-container-with-member"
        name: read-container-with-member
        status: Proposed
        traits: [Get, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#container-representation
        prereqs:
          - "@id": "#create-data-resource"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:container
          headers:
            - fieldName: Accept
              fieldValue: application/lws+json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/lws+json
            - fieldName: ETag
              fieldValue:
                "@present": true
          bodyShape:
            id:
              "@id": urn:lws-tests:variables:container
            type:
              "@includes": Container
            totalItems:
              "@datatype": integer
            items:
              "@contains":
                id:
                  "@id": urn:lws-tests:variables:dataResource
                type:
                  "@includes": DataResource
                format: application/json

      - "@type": ValidationTest
        "@id": "#reject-delete-nonempty-container"
        name: reject-delete-nonempty-container
        status: Proposed
        traits: [Delete, NegativeTest, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#delete-resource
        prereqs:
          - "@id": "#create-data-resource"
        request:
          method: DELETE
          url:
            "@id": urn:lws-tests:variables:container
        response:
          statusCode: 409

      - "@type": ValidationTest
        "@id": "#replace-data-resource"
        name: replace-data-resource
        status: Proposed
        traits: [Put, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#update-resource
        prereqs:
          - "@id": "#read-data-resource"
        request:
          method: PUT
          url:
            "@id": urn:lws-tests:variables:dataResource
          headers:
            - fieldName: Content-Type
              fieldValue: application/json
            - fieldName: If-Match
              fieldValue:
                "@id": urn:lws-tests:variables:dataEtag
          body: '{"title":"replaced","done":false}'
        response:
          statusCode:
            "@oneOf": [200, 204]

      - "@type": ValidationTest
        "@id": "#read-replaced-data-resource"
        name: read-replaced-data-resource
        status: Proposed
        traits: [Get, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#read-resource
        prereqs:
          - "@id": "#replace-data-resource"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:dataResource
          headers:
            - fieldName: Accept
              fieldValue: application/json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/json
            - fieldName: ETag
              fieldValue:
                "@id": urn:lws-tests:variables:replacedDataEtag
          bodyShape:
            title: replaced
            done: false

      - "@type": ValidationTest
        "@id": "#patch-data-resource"
        name: patch-data-resource
        status: Proposed
        traits: [Patch, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#update-resource
        prereqs:
          - "@id": "#read-replaced-data-resource"
        request:
          method: PATCH
          url:
            "@id": urn:lws-tests:variables:dataResource
          headers:
            - fieldName: Content-Type
              fieldValue: application/merge-patch+json
            - fieldName: If-Match
              fieldValue:
                "@id": urn:lws-tests:variables:replacedDataEtag
          body: '{"done":true}'
        response:
          statusCode:
            "@oneOf": [200, 204]

      - "@type": ValidationTest
        "@id": "#read-patched-data-resource"
        name: read-patched-data-resource
        status: Proposed
        traits: [Get, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#read-resource
        prereqs:
          - "@id": "#patch-data-resource"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:dataResource
          headers:
            - fieldName: Accept
              fieldValue: application/json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/json
            - fieldName: ETag
              fieldValue:
                "@id": urn:lws-tests:variables:patchedDataEtag
          bodyShape:
            title: replaced
            done: true

      - "@type": ValidationTest
        "@id": "#delete-data-resource"
        name: delete-data-resource
        status: Proposed
        traits: [Delete, DataResource]
        source: https://w3c.github.io/lws-protocol/lws10-core/#delete-resource
        prereqs:
          - "@id": "#read-patched-data-resource"
          - "@id": "#read-data-linkset"
          - "@id": "#read-container-with-member"
          - "@id": "#reject-delete-nonempty-container"
        request:
          method: DELETE
          url:
            "@id": urn:lws-tests:variables:dataResource
          headers:
            - fieldName: If-Match
              fieldValue:
                "@id": urn:lws-tests:variables:patchedDataEtag
        response:
          statusCode: 204

      - "@type": ValidationTest
        "@id": "#read-container-after-delete"
        name: read-container-after-delete
        status: Proposed
        traits: [Get, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#delete-resource
        prereqs:
          - "@id": "#delete-data-resource"
        request:
          method: GET
          url:
            "@id": urn:lws-tests:variables:container
          headers:
            - fieldName: Accept
              fieldValue: application/lws+json
        response:
          statusCode: 200
          headers:
            - fieldName: Content-Type
              fieldValue:
                "@mediaType": application/lws+json
            - fieldName: ETag
              fieldValue:
                "@present": true
          bodyShape:
            id:
              "@id": urn:lws-tests:variables:container
            type:
              "@includes": Container
            totalItems:
              "@datatype": integer
            items:
              "@notContains":
                id:
                  "@id": urn:lws-tests:variables:dataResource

      - "@type": ValidationTest
        "@id": "#delete-empty-container"
        name: delete-empty-container
        status: Proposed
        traits: [Delete, Container]
        source: https://w3c.github.io/lws-protocol/lws10-core/#delete-resource
        prereqs:
          - "@id": "#read-container-after-delete"
        request:
          method: DELETE
          url:
            "@id": urn:lws-tests:variables:container
        response:
          statusCode: 204
